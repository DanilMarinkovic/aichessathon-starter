[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "harness"]

# The engine modules are compiled by numba, which takes its types from the signature in each
# njit decorator and ignores the annotations entirely. Inside a jitted function a name is a
# numpy scalar, at the call site it is a Python int, and mypy cannot model the boundary
# between them. Correctness there is established by tests/check_perft.py against python-chess,
# not by the type checker. agent.py, which is the actual contract with the platform, stays
# strictly checked.
[[tool.mypy.overrides]]
module = ["bitboards", "position", "movegen", "evaluate", "searcher"]
ignore_errors = true
